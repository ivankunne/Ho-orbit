# Supabase CLI config for h-orbit.
# Generated for the `notify` Edge Function deploy. Safe to commit.

project_id = "ellezlbjqrjcxeifrwdo"

# Notification emails (new chat message / new follower).
# verify_jwt = true → only logged-in users (with a valid session token) can
# invoke it; the function itself re-validates the caller. Keep this on.
[functions.notify]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify/index.ts"

# Starts a Stripe Checkout session for the logged-in user. verify_jwt = true:
# only a logged-in user may start a checkout for themself.
[functions.stripe-checkout]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-checkout/index.ts"

# Opens the Stripe Customer Portal for the logged-in user.
[functions.stripe-portal]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-portal/index.ts"

# Stripe calls this directly with no Supabase auth header — trust comes only
# from the Stripe-Signature check inside the function. Must stay off.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"

# Public plan price info (no user data) for the Abonnement screen.
[functions.stripe-plan]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-plan/index.ts"
